name: Build raphael kernel (KernelSU-Next)

# ============================================================
# 目标：编译一颗集成 KernelSU-Next 的 4.14 内核
#
# 基座：qaz6750/android_kernel_xiaomi_sm8150 @ a14-xiaomi-4.14.y
# 配置：raphael 真机 config + CONFIG_KSU=y + CONFIG_KSU_MANUAL_HOOK=y
# 设备：Redmi K20 Pro (raphael / SM8150)
#
# 流程：
#   1. clone 内核源码
#   2. 应用 KSU manual hook 补丁（ksu_hooks.patch）
#   3. 注入 KernelSU-Next 源码（drivers/kernelsu）
#   4. 准备工具链（AOSP clang-r487747c = clang 17 + GCC 4.9）
#      v2 变更：clang-r383902(11.0.1) -> clang-r487747c(17.0.0)
#   5. 生成 .config
#   6. 编译 Image.gz
#   7. 上传 artifact
# ============================================================

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核源码仓库'
        required: false
        default: 'qaz6750/android_kernel_xiaomi_sm8150'
      kernel_ref:
        description: '分支/tag'
        required: false
        default: 'a14-xiaomi-4.14.y'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      # ---------- 1. 内核源码 ----------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.kernel_repo || 'qaz6750/android_kernel_xiaomi_sm8150' }}
          ref: ${{ github.event.inputs.kernel_ref || 'a14-xiaomi-4.14.y' }}
          path: kernel
          fetch-depth: 1

      # ---------- 2. 取本仓库的补丁包 ----------
      - name: Checkout payload
        uses: actions/checkout@v4
        with:
          path: _ci

      # ---------- 3. 环境 ----------
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev make libc6-dev libncurses-dev \
            zip unzip python3 cpio rsync

      - name: Show payload
        run: |
          echo "=== payload 内容 ==="
          ls -la "$GITHUB_WORKSPACE/_ci/payload/"
          echo "=== patch 预览 ==="
          head -30 "$GITHUB_WORKSPACE/_ci/payload/ksu_hooks.patch"

      # ---------- 3.5 增加 swap（关键！）----------
      # GitHub ubuntu-24.04 runner 只有 7GB RAM。`make -j4` 用 clang 编译
      # 4.14 内核时，并发编译大文件（如 net/ 子系统的 trace.o、regdb.o）
      # 峰值内存会超过 7GB，触发 OOM killer 杀掉 clang 进程，
      # 表现为大量 "LLVM ERROR: IO failure on output stream: Broken pipe"
      # （run #8 就是这么挂的：跑了 4 分钟到 net/built-in.o 后集体断管）。
      # 加 8GB swap 兜底。
      - name: Add swap space
        run: |
          echo ">>> 当前内存 / swap"
          free -h
          echo ">>> 创建 8G swap"
          sudo fallocate -l 8G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          echo ">>> 之后"
          free -h
          echo ">>> swappiness"
          cat /proc/sys/vm/swappiness

      # ---------- 4. 注入 KernelSU ----------
      - name: Inject KernelSU-Next
        working-directory: kernel
        run: |
          bash "$GITHUB_WORKSPACE/_ci/payload/drivers_inject.sh"

      # ---------- 5. 工具链 ----------
      # 【v2 关键变更】clang 11.0.1 (r383902) -> clang 17.0.0 (r487747c)
      #
      # 变更理由（三层证据）：
      #   1) 上一轮刷入 clang11 编译的内核后 bootloop（logo→黑屏2s→logo 循环），
      #      排除法定位到 clang 版本是唯一实质差异：
      #        AVB algorithm_type=0 无签名 ✗ / ramdisk sha256 一致 ✗ /
      #        DTB 446802 一致 ✗ / defconfig 与真机 IKCONFIG diff=0 ✗ /
      #        LTO 两边均 NONE ✗  ⇒ 只剩 clang 版本 ⚠️
      #   2) 目标外挂 Mini_hook_extracted.ko 的 .comment = "clang version 17.0.0"
      #      ⇒ clang 17 已被证明能编出「可被 4.14 内核加载」的模块产物
      #   3) 真机 Zundamon Evo 用 clang 22，我们 CI 用 clang 11，跨度过大；
      #      clang 17 是 AOSP 官方仍在维护、且与 4.14 内核兼容性最好的中位版本
      #
      # 版本可用性（已实测 AOSP prebuilts/clang/host/linux-x86 分支）：
      #   android14-release / android14-qpr1 / android14-qpr2 / android-15.0.0_r1
      #     均含 clang-r487747c ✓
      - name: Clone AOSP clang (r487747c = clang 17)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          echo ">>> 稀疏 clone AOSP prebuilts/clang"
          git clone --depth=1 --filter=blob:none --sparse \
            -b android14-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-aosp 2>&1 | tail -3 || {
              echo "!!! android14-release 不存在，改用 android-15.0.0_r1"
              git clone --depth=1 --filter=blob:none --sparse \
                -b android-15.0.0_r1 \
                https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
                clang-aosp
            }
          cd clang-aosp
          git sparse-checkout set clang-r487747c 2>&1 | tail -3
          ls -la clang-r487747c/bin/clang || {
            echo "!!! clang-r487747c 二进制缺失，回退 clang-r475365b"
            git sparse-checkout set clang-r475365b
          }
          # 实际使用的 clang 目录（供后续步骤引用，避免硬编码）
          CLANGDIR=$(ls -d clang-r487747c 2>/dev/null || ls -d clang-r475365b)
          echo "$GITHUB_WORKSPACE/clang-aosp/$CLANGDIR" > /tmp/clangdir.txt
          echo "CLANGDIR=$CLANGDIR"
          ./$CLANGDIR/bin/clang --version | head -4

          # ---------- 生成 clang 工具链 wrapper ----------
          # 【v2 变更】--target 注入仍然保留：clang 17 对 -mgeneral-regs-only 的
          #   处理与 clang 11 一致（aarch64 target 下才认为该 flag 有效），
          #   且 -Wunused-command-line-argument 依然会被 -Werror 放大。
          #   历史诊断（run #6，clang 11 时期）：
          #     裸 clang -fstack-protector-strong                       -> OK
          #     clang --target=... -fstack-protector-strong             -> OK
          #     clang --target=... + arm64 flags -fstack-protector-strong -> OK
          #     clang（无 target）+ arm64 flags -fstack-protector-strong  -> FAIL
          #         clang-11: error: argument unused during compilation:
          #                   '-mgeneral-regs-only' [-Werror,-Wunused-command-line-argument]
          #   即：必须让 clang 以 aarch64 target 运行，否则 -mgeneral-regs-only
          #   会被当成「未使用参数」被 -Werror 拒绝，导致 cc-option 探测失败，
          #   进而 kernel/Makefile:1348 prepare-compiler-check 报
          #     "Cannot use CONFIG_CC_STACKPROTECTOR_STRONG"
          #
          # Kbuild 理论上会自己加（Makefile:525 CLANG_FLAGS += --target=...），
          # 但实测该路径未生效（疑似 cc-name/CROSS_COMPILE 判定问题）。
          # 因此在 wrapper 层兜底注入。若 Kbuild 也传了 --target，clang 取
          # 最后一个且值相同，不会冲突。
          echo ">>> 生成 clang/工具链 wrapper（注入 aarch64 target）"
          WRAP="$GITHUB_WORKSPACE/wrap"
          mkdir -p "$WRAP"
          CB=$(cat /tmp/clangdir.txt)/bin
          echo "CB=$CB"
          ls "$CB" | head -20
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy \
                   llvm-objdump llvm-readelf llvm-strip llvm-ranlib; do
            [ -x "$CB/$t" ] || continue
            case "$t" in
              clang|clang++)
                printf '#!/bin/bash\nexec "%s/%s" --target=aarch64-linux-gnu "$@"\n' "$CB" "$t" > "$WRAP/$t"
                ;;
              *)
                printf '#!/bin/bash\nexec "%s/%s" "$@"\n' "$CB" "$t" > "$WRAP/$t"
                ;;
            esac
            chmod +x "$WRAP/$t"
          done
          # CROSS_COMPILE 前缀工具（Kbuild 可能直接找 aarch64-linux-gnu-ld 等）
          # 必须包含 elfedit：内核 Makefile:528 用
          #   GCC_TOOLCHAIN_DIR := $(dir $(shell which $(CROSS_COMPILE)elfedit))
          # 来推导 --prefix / --gcc-toolchain，缺失会导致该行报错或推导为空。
          # 注意：不再把 `as` 映射到 clang！run #7 的
          #   /tmp/empty-*.s: .word 3221225472 out of range
          # 正是因为 -no-integrated-as（Makefile:536，LLVM_IAS != 1 时强制开启）
          # 去调外部 as，而外部 as 又被指向 clang，导致汇编语义错乱。
          # 解决方式是设 LLVM_IAS=1 用 clang 自带集成汇编器（见下面 Build 步骤）。
          for t in ld:ld.lld ar:llvm-ar nm:llvm-nm objcopy:llvm-objcopy \
                   objdump:llvm-objdump readelf:llvm-readelf strip:llvm-strip \
                   ranlib:llvm-ranlib elfedit:llvm-readelf; do
            dst="${t%%:*}"; src="${t##*:}"
            [ -x "$CB/$src" ] || continue
            printf '#!/bin/bash\nexec "%s/%s" "$@"\n' "$CB" "$src" > "$WRAP/aarch64-linux-gnu-$dst"
            chmod +x "$WRAP/aarch64-linux-gnu-$dst"
          done
          # gcc 前缀 → clang（带 target）
          printf '#!/bin/bash\nexec "%s/clang" --target=aarch64-linux-gnu "$@"\n' "$CB" > "$WRAP/aarch64-linux-gnu-gcc"
          chmod +x "$WRAP/aarch64-linux-gnu-gcc"
          ls -la "$WRAP/"
          echo ">>> 验证 wrapper"
          "$WRAP/clang" --version | head -1
          echo 'int main(void){return 0;}' > /tmp/t.c
          "$WRAP/clang" -fstack-protector-strong -c /tmp/t.c -o /tmp/t.o && echo "OK: 裸 -fstack-protector-strong" || echo "!!: 裸不支持"
          # 关键验证：模拟 Kbuild 的 cc-option 完整路径
          "$WRAP/clang" -Werror \
            -mgeneral-regs-only -fno-asynchronous-unwind-tables -fno-pic \
            -fstack-protector-strong -c -x c /dev/null -o /tmp/t2.o \
            && echo "OK: wrapper + arm64 flag 组合支持" || echo "!!: 完整组合不支持"

      - name: Clone GCC 4.9 prebuilt
        continue-on-error: true
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          echo ">>> clone AOSP gcc 4.9 prebuilt"
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            gcc49 2>&1 | tail -3 || echo "!!! clone 失败"
          echo "=== gcc49 目录内容 ==="
          ls -la gcc49/ | head -20
          # AOSP 该仓库往往只放压缩包，需要解压
          for f in gcc49/*.tar.gz gcc49/*.tar.bz2 gcc49/*.tar.xz; do
            [ -f "$f" ] || continue
            echo ">>> 发现压缩包 $f，解压"
            tar xf "$f" -C gcc49/
          done
          # 找到真正的 bin 目录
          GCCBIN=$(find gcc49 -maxdepth 4 -name "aarch64-linux-android-gcc" -printf '%h\n' 2>/dev/null | head -1)
          echo "GCCBIN=$GCCBIN"
          if [ -n "$GCCBIN" ]; then
            echo "$GITHUB_WORKSPACE/$GCCBIN" > /tmp/gccbin.txt
            ls -la "$GCCBIN" | head -5
            "$GCCBIN/aarch64-linux-android-gcc" --version | head -1 || true
          else
            echo "!!! 未找到 gcc 二进制（clang 独立编译通常不需要，继续）"
          fi

      # ---------- 6. 配置 ----------
      - name: Prepare .config
        working-directory: kernel
        shell: bash
        run: |
          set +e
          export PATH="$GITHUB_WORKSPACE/wrap:$PATH"
          [ -f /tmp/gccbin.txt ] && export PATH="$(cat /tmp/gccbin.txt):$PATH" || true

          export ARCH=arm64 CC=clang LD=ld.lld LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          # 用真机 config（in-tree 构建，不用 O=out）
          if [ -f "$GITHUB_WORKSPACE/_ci/payload/device.config" ]; then
            cp "$GITHUB_WORKSPACE/_ci/payload/device.config" .config
            echo ">>> 使用 device.config"
          else
            make ARCH=arm64 raphael_defconfig
            echo ">>> 使用 raphael_defconfig"
          fi

          # 追加 KSU 配置
          cat "$GITHUB_WORKSPACE/_ci/payload/config_append.txt" >> .config

          # ---------- 保留 CONFIG_CC_STACKPROTECTOR_STRONG（不再关闭）----------
          # 历史：run #5~#7 因 prepare-compiler-check 探测
          #   -fstack-protector-strong not supported by compiler 失败，
          #   当时临时关掉 STACKPROTECTOR 绕过。
          # 代价：arch/arm64/kernel/process.c:65-69 的 __stack_chk_guard 导出
          #   被 #ifdef CONFIG_CC_STACKPROTECTOR 包裹，关掉后该符号不再导出，
          #   会导致 Mini_hook 等外部 .ko 报 Unknown symbol __stack_chk_guard。
          # 现况：run #7 的探测失败根因是 -no-integrated-as 扰动；run #8 起
          #   已设 LLVM_IAS=1 且 wrapper clang 注入 --target=aarch64-linux-gnu，
          #   探测条件已恢复，故重新打开以保住 __stack_chk_guard 导出。
          echo "=== STACKPROTECTOR 保持 device.config 原值 ==="
          grep -E "STACKPROTECTOR" .config

          # ---------- 源码修复：全树 TRACE_INCLUDE_PATH ----------
          # 背景（run #10/#11 两轮踩坑）：
          #   include/trace/define_trace.h 展开出 **引号形式** include：
          #       #include "TRACE_INCLUDE_PATH/TRACE_INCLUDE_FILE.h"
          #   引号 include 搜索顺序：
          #       1) 当前头文件所在目录 = <root>/include/trace/
          #       2) 依次尝试 -I 列表
          #   define_trace.h 顶部注释明说：
          #       "the path is relative to define_trace.h, not the file including it"
          #   故 TRACE_INCLUDE_PATH 必须写成「相对 include/trace/ 的路径」。
          #   上游正确样例 drivers/dma-buf/sync_trace.h: ../../drivers/dma-buf
          #   错误写法（clang 必失败）：
          #     "."                 -> include/trace/./xxx.h 不存在
          #     "arch/arm64/kernel" -> include/trace/arch/... 不存在，-I 也无内核根
          #
          # 修复脚本随 payload 推送到 _ci/payload/ 下，避免在 YAML 里
          # 内联 heredoc（零缩进行会被 YAML 当作顶层键而解析失败）。
          echo "=== 修复全树 TRACE_INCLUDE_PATH ==="
          python3 "$GITHUB_WORKSPACE/_ci/payload/fix_trace_include_path.py" .
          echo "=== 抽查 ==="
          grep -n "TRACE_INCLUDE_PATH" drivers/hid/hid-trace.h || true
          grep -n "TRACE_INCLUDE_PATH" arch/arm64/kernel/trace-events-emulation.h || true
          grep -n "TRACE_INCLUDE_PATH" drivers/media/platform/msm/camera/cam_utils/cam_trace.h || true
          echo "=== 自校验（模拟 clang 引号 include 搜索）==="
          python3 "$GITHUB_WORKSPACE/_ci/payload/check_trace_include_path.py" . || true
          echo "=== STACKPROTECTOR 待确认（olddefconfig 后）==="
          grep -E "STACKPROTECTOR|CONFIG_KSU" .config

          # 【run #16 关键修正】两步走，顺序不可颠倒：
          #   步骤 A: olddefconfig —— 消化 .config 里的 (NEW) 符号（取默认值、不提问）。
          #           它走 Makefile:575 的 %config 模式，只写 .config。
          #   步骤 B: silentoldconfig —— 此时 .config 已无 NEW 符号，conf --silentoldconfig
          #           不会再提问，safe 地 mkdir -p include/config 并写出 auto.conf。
          #           （run #15 教训：直接跑 silentoldconfig 会遇到
          #            "BPF_UNPRIV_DEFAULT_OFF [N/y/?] (NEW) aborted!" 而失败。）
          #   run #15 已证明 auto.conf 由 silentoldconfig 写出，olddefconfig 不写。
          echo "=== [A] olddefconfig（消化 NEW 符号）==="
          make ARCH=arm64 CC=clang LD=ld.lld LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig 2>&1 | tail -8
          echo "=== [B] silentoldconfig（生成 auto.conf）==="
          mkdir -p include/config include/generated
          ls -la include/config/auto.conf 2>/dev/null || echo "  (auto.conf 尚未生成)"
          make ARCH=arm64 CC=clang LD=ld.lld LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            silentoldconfig < /dev/null 2>&1 | tail -8
          echo "--- 主步骤后 auto.conf 检查 ---"
          ls -la include/config/auto.conf 2>/dev/null || echo "  !! auto.conf 不存在"
          grep -E "^CONFIG_KSU" include/config/auto.conf 2>/dev/null || echo "  !! auto.conf 无 KSU"

          echo ""
          echo "=== 关键配置 (after olddefconfig) ==="
          grep -E "CONFIG_KSU|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_KPROBES|STACKPROTECTOR" .config

          echo ""
          echo "=== 编译器信息 ==="
          which clang; clang --version | head -1
          echo "LLVM_IAS=1（禁用 -no-integrated-as，改用 clang 集成汇编器）"

          # ---------- KSU 集成诊断（run #13 新增）----------
          # run #12 链接期报 ksu_handle_* undefined，但 .config 里 CONFIG_KSU=y。
          # 说明 drivers/kernelsu/ 根本没进编译。这里把整条链路打出来定位。
          echo ""
          # ---------- 保险 2：强制回写 KSU 配置并重跑 syncconfig（run #14）----------
          # run #12 现象：.config 里 CONFIG_KSU=y，但 drivers/kernelsu/ 完全未编译，
          #   链接期报 ksu_handle_* undefined。
          # 推断：olddefconfig 重算配置时把 CONFIG_KSU 裁掉了，或 auto.conf 未及时更新，
          #   导致 drivers/Makefile 的 obj-$(CONFIG_KSU) 不展开。
          # 做法：olddefconfig 之后硬写 .config，再 syncconfig 重建 auto.conf。
          echo ""
          echo "=== 保险 2：强制回写 KSU 配置 ==="
          sed -i 's|^# CONFIG_KSU is not set|CONFIG_KSU=y|' .config
          sed -i 's|^# CONFIG_KSU_MANUAL_HOOK is not set|CONFIG_KSU_MANUAL_HOOK=y|' .config
          grep -q "^CONFIG_KSU=" .config || echo "CONFIG_KSU=y" >> .config
          grep -q "^CONFIG_KSU_MANUAL_HOOK=" .config || echo "CONFIG_KSU_MANUAL_HOOK=y" >> .config
          echo "--- 回写后 .config ---"
          grep -E "^CONFIG_KSU" .config
          # 【run #14 关键修正】4.14 内核里目标名是 silentoldconfig，不是 syncconfig！
          #   查 kernel/Makefile:657-658：
          #     include/config/%.conf: $(KCONFIG_CONFIG) include/config/auto.conf.cmd
          #         $(Q)$(MAKE) -f $(srctree)/Makefile silentoldconfig
          #   run #14 用 syncconfig 报 "No rule to make target 'syncconfig'"。
          #   silentoldconfig 实现（scripts/kconfig/Makefile:37-41）会：
          #     mkdir -p include/config include/generated
          #     conf --silentoldconfig   → 写 include/config/auto.conf
          echo "=== 重建 auto.conf（olddefconfig + silentoldconfig 两步）==="
          mkdir -p include/config include/generated
          touch include/generated/autoksyms.h 2>/dev/null || true
          echo "  -- (A) olddefconfig 消化 NEW --"
          make ARCH=arm64 CC=clang LD=ld.lld LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig < /dev/null 2>&1 | tail -6 || true
          echo "  -- (B) silentoldconfig 写 auto.conf --"
          make ARCH=arm64 CC=clang LD=ld.lld LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            silentoldconfig < /dev/null 2>&1 | tail -12 || true
          echo "--- auto.conf 中的 KSU（关键）---"
          ls -la include/config/auto.conf 2>/dev/null || echo "  !! auto.conf 文件不存在"
          grep -E "^CONFIG_KSU" include/config/auto.conf 2>/dev/null || echo "  !! auto.conf 仍无 KSU"
          ls -d include/config/kernelsu 2>/dev/null && echo "  (include/config/kernelsu 存在 => CONFIG_KSU=y 生效)" || echo "  (无 include/config/kernelsu 目录)"
          echo "--- [2b] include/generated/autoconf.h 中的 KSU ---"
          grep -n "CONFIG_KSU" include/generated/autoconf.h 2>/dev/null | head -5 || echo "  !! autoconf.h 无 KSU"
          # ---------- 保险 3：直接补写 auto.conf（不依赖 Kconfig 链路）----------
          # syncconfig 会重写 auto.conf，所以补写必须放在它之后。
          # 【注意】不能同时往 drivers/Makefile 加 "obj-y += kernelsu/"：
          #   obj-y 展开用 $(patsubst)，不去重，会 duplicate symbol。
          #   只补 auto.conf，让 drivers/Makefile 里的 obj-$(CONFIG_KSU) 正常展开。
          if ! grep -q "^CONFIG_KSU=y" include/config/auto.conf 2>/dev/null; then
            echo "!! auto.conf 无 CONFIG_KSU -> 直接补写"
            mkdir -p include/config
            cp -f include/config/auto.conf include/config/auto.conf.orig 2>/dev/null || true
            touch include/config/auto.conf
            echo "CONFIG_KSU=y" >> include/config/auto.conf
            # 【run #15 教训】只写 auto.conf 不写 auto.conf.cmd 会让 make 认为
            # auto.conf 需要重建，但 Image.gz 构建期找不到生成规则，报
            #   "No rule to make target 'include/config/auto.conf',
            #    needed by 'include/config/kernel.release'"
            # 这里同时 touch 出 auto.conf.cmd 并让 .config 不新于 auto.conf，
            # 使 make 判定 auto.conf 已是最新，跳过重建。
            touch include/config/auto.conf.cmd
            touch include/generated/autoconf.h 2>/dev/null || true
            touch include/config/auto.conf
            echo "   (已同步 touch auto.conf.cmd / autoconf.h)"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> include/config/auto.conf
            echo "   已补写 auto.conf"
          else
            echo ">> auto.conf 已有 CONFIG_KSU=y，无需兜底"
          fi
          echo "--- 最终 auto.conf KSU ---"
          grep -E "^CONFIG_KSU" include/config/auto.conf 2>/dev/null || echo "  !! 仍无"
          # Kbuild 在 CONFIG_KSU=y 时创建 include/config/kernelsu/ 目录；
          # 兜底补写 auto.conf 不会自动建它，手动建一个，保证 include/config/auto.conf.cmd
          # 之外的一致性检查（如 silentoldconfig 的 auto.conf.cmd）不误判。
          mkdir -p include/config/kernelsu 2>/dev/null || true
          ls -d include/config/kernelsu && echo "  (已建 include/config/kernelsu)"
          echo "########## KSU 集成诊断 ##########"
          echo "--- [1] drivers/Makefile 末尾 ---"
          grep -n "kernelsu" drivers/Makefile || echo "  !! drivers/Makefile 无 kernelsu 条目"
          echo "--- [2] include/config/auto.conf 中的 KSU ---"
          grep -n "^CONFIG_KSU" include/config/auto.conf 2>/dev/null || echo "  !! auto.conf 无 KSU（配置未生效）"
          echo "--- [2e] drivers/Kconfig 尾部 source 列表 ---"
          grep -n "^source" drivers/Kconfig | tail -6
          echo "--- [2f] drivers/kernelsu/Kconfig 是否存在 ---"
          ls -la drivers/kernelsu/Kconfig 2>/dev/null || echo "  !! 不存在"
          echo "--- [2g] .config 里的 CONFIG_MODULES/TRIM_UNUSED ---"
          grep -E "^CONFIG_MODULES|UNUSED_SYMBOLS|^CONFIG_TRIM" .config || true
          echo "--- [3] drivers/kernelsu 目录 ---"
          ls -la drivers/kernelsu/ 2>/dev/null | head -20 || echo "  !! 目录不存在"
          echo "--- [4] Kbuild 前 10 行 + obj- 行 ---"
          head -10 drivers/kernelsu/Kbuild 2>/dev/null
          grep -n "^obj-" drivers/kernelsu/Kbuild 2>/dev/null
          echo "--- [5] Kbuild $(error) 守卫判定（HAVE_KSU_HOOK）---"
          grep -q "ksu_handle_sys_reboot" ./kernel/reboot.c && echo "  命中 -> HAVE_KSU_HOOK=0 (success)" || echo "  未命中 -> 1 (failure)"
          echo "--- [6] make 是否会 descend 到 drivers/kernelsu ---"
          make -n ARCH=arm64 CC=clang LD=ld.lld LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            drivers/ 2>&1 | grep -i "kernelsu" | head -10 \
            || echo "  !! make -n drivers/ 未见 kernelsu（说明未被收集）"
          echo "########## 诊断结束 ##########"

          # ---------- ★ v2 新增：模块支持硬断言 ----------
          # 目的：在动手编译前就确认「本次内核真的会带模块子系统」。
          # 背景：device.config 里写了 CONFIG_MODULES=y，但 Zundamon Evo 真机
          #   的 /proc/config.gz 同样写 =y，实际却因 cond_syscall 弱符号桩而
          #   完全不可用（/proc/modules 不存在、sys_init_module 返回 -ENOSYS）。
          #   因此不能只信 .config 文本，必须查 auto.conf（Kconfig 求解后的
          #   真实结果）+ 检查 Kconfig 依赖是否把 MODULES 裁掉。
          echo ""
          echo "########## ★ 模块支持硬断言 ##########"
          MOD_OK=1
          for sym in CONFIG_MODULES CONFIG_MODVERSIONS CONFIG_MODULE_UNLOAD; do
            if grep -q "^${sym}=y" include/config/auto.conf 2>/dev/null; then
              echo "  ✓ auto.conf: ${sym}=y"
            else
              echo "  ✗✗ auto.conf: ${sym} 未生效！"
              MOD_OK=0
            fi
          done
          if grep -q "^CONFIG_TRIM_UNUSED_KSYMS=y" include/config/auto.conf 2>/dev/null; then
            echo "  ✗✗ CONFIG_TRIM_UNUSED_KSYMS=y —— 会裁掉未被内核内部引用的导出符号，"
            echo "      外挂 .ko 依赖的符号可能消失！必须关闭。"
            MOD_OK=0
          else
            echo "  ✓ CONFIG_TRIM_UNUSED_KSYMS 未开启"
          fi
          # 模块子系统启动日志字符串：CONFIG_MODULES=n 时这段代码整体被编译掉
          echo "  --- 源码侧证据：kernel/module.c 是否会被编译 ---"
          if grep -q "^CONFIG_MODULES=y" include/config/auto.conf 2>/dev/null; then
            grep -n "obj-\$(CONFIG_MODULES)" kernel/Makefile | head -3
          fi
          echo "  --- kernel/sys_ni.c 的 cond_syscall 桩（若 MODULES=y 则不会真正生效）---"
          grep -n "cond_syscall" kernel/sys_ni.c | head -5
          if [ "$MOD_OK" = "0" ]; then
            echo ""
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
            echo "!! 模块支持断言失败 —— 本次构建出的内核无法加载 .ko"
            echo "!! 继续编译仅用于收集日志，产物不可用于 insmod"
            echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          else
            echo "  ===> ✓ 模块支持断言全部通过，本次内核应可 insmod 外挂 .ko"
          fi
          echo "########## 断言结束 ##########"

      # ---------- 7. 编译 ----------
      - name: Build Image.gz
        working-directory: kernel
        shell: bash
        run: |
          # 全程关闭 -e：GitHub Actions 默认 `bash -e`，一旦 make 失败会
          # 直接杀掉整个脚本，导致后面的兜底重试与日志回显全部丢失
          # （run #6 就栽在这里）。所有 make 都显式捕获退出码。
          set +e
          export PATH="$GITHUB_WORKSPACE/wrap:$PATH"
          [ -f /tmp/gccbin.txt ] && export PATH="$(cat /tmp/gccbin.txt):$PATH" || true

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          # LLVM_IAS=1 → 不启用 -no-integrated-as（内核 Makefile:536），
          # 改用 clang 自带集成汇编器。run #7 的
          #   /tmp/empty-*.s: .word 3221225472 out of range
          # 就是 -no-integrated-as 调外部 as（被指向 clang）导致的。
          export LLVM_IAS=1

          echo "nproc=$(nproc)"
          echo "which clang: $(which clang)"
          clang --version | head -1
          echo "LLVM_IAS=$LLVM_IAS"
          free -h

          MAKEFLAGS_COMMON="ARCH=arm64 CC=clang LD=ld.lld LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-"

          # 并行度降到 3：runner 是 4 核但只有 7GB RAM，
          # -j4 在编译 net/ 等大文件时会 OOM（run #8 的 Broken pipe）。
          JOBS=3
          echo "并行度 = -j$JOBS"

          run_make () {
            rm -f /tmp/build_out.txt
            make -j$JOBS $MAKEFLAGS_COMMON Image.gz > /tmp/build_out.txt 2>&1
            return $?
          }

          echo ""
          echo "########## 尝试 1：原 config（保留 STACKPROTECTOR）##########"
          run_make
          rc=$?
          echo "===== 尝试 1 退出码: $rc ====="

          if [ $rc -ne 0 ]; then
            # ---- 兜底 A0（v2 新增）：clang 17 对 4.14 老内核的已知不兼容 ----
            # clang 16+ 默认把「隐式函数声明 / 隐式整型转换」等提升为 error。
            # 4.14（2017 年代码）大量存在这类写法，会直接编译失败。
            # 处理：给内核构建注入 -Wno-* 降级开关（KCFLAGS 会被 Kbuild 追加到
            # 每个 TU 的编译命令行末尾，可覆盖前面的 -Werror）。
            if grep -qE "error: (implicit|incompatible|use of undeclared|unknown type name)" /tmp/build_out.txt \
               || grep -q "clang: error:" /tmp/build_out.txt; then
              echo ""
              echo "########## 检测到 clang17 严格模式报错 → 注入 -Wno-* 降级后重试 ##########"
              export KCFLAGS="-Wno-error -Wno-implicit-function-declaration \
                -Wno-implicit-int -Wno-int-conversion -Wno-incompatible-pointer-types \
                -Wno-unused-command-line-argument -Wno-unknown-warning-option \
                -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
              echo "KCFLAGS=$KCFLAGS"
              MAKEFLAGS_COMMON="$MAKEFLAGS_COMMON KCFLAGS='-Wno-error -Wno-implicit-function-declaration -Wno-implicit-int -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-error=incompatible-pointer-types'"
              echo "########## 尝试 1b：clang17 宽松模式 ##########"
              run_make
              rc=$?
              echo "===== 尝试 1b 退出码: $rc ====="
            fi
          fi

          if [ $rc -ne 0 ]; then
            # ---- 兜底 A：stack protector 探测失败 → 关掉它再试 ----
            if grep -q "stack-protector-strong not supported\|prepare-compiler-check\|Cannot use CONFIG_CC_STACKPROTECTOR" /tmp/build_out.txt; then
              echo ""
              echo "########## 检测到 stack protector 探测失败 → 自动关闭后重试 ##########"
              sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config
              sed -i 's/^# CONFIG_CC_STACKPROTECTOR_NONE is not set/CONFIG_CC_STACKPROTECTOR_NONE=y/' .config
              sed -i 's/^CONFIG_CC_STACKPROTECTOR=y/# CONFIG_CC_STACKPROTECTOR is not set/' .config
              make $MAKEFLAGS_COMMON olddefconfig > /dev/null 2>&1
              echo "注意：此路径会导致 __stack_chk_guard 不再导出，外部 .ko 需另行处理"
              echo "########## 尝试 2：关闭 STACKPROTECTOR ##########"
              run_make
              rc=$?
              echo "===== 尝试 2 退出码: $rc ====="
            elif ! grep -qE "^make.*Error|Error [0-9]" /tmp/build_out.txt && [ $rc -ne 0 ]; then
              # ---- 兜底 B：无明确错误的偶发失败（如管道/资源抖动）→ 原地重试 ----
              echo ""
              echo "########## 无明确编译错误 → 原地重试一次 ##########"
              run_make
              rc=$?
              echo "===== 重试退出码: $rc ====="
            fi
          fi

          echo "===== 编译错误（grep error，前 60 条） ====="
          grep -inE "error:|Error [0-9]|fatal error" /tmp/build_out.txt | head -60
          echo "===== 末尾 80 行 ====="
          tail -80 /tmp/build_out.txt
          echo ""
          echo "===== dmesg OOM 检查 ====="
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom|killed process" | tail -10 || echo "(无 OOM 记录或无权限)"
          free -h

          echo ""
          echo "########## 产物 ##########"
          ls -la arch/arm64/boot/ 2>/dev/null || echo "无产物"
          if [ -f arch/arm64/boot/Image.gz ]; then
            echo "✓✓ Image.gz 已生成: $(stat -c %s arch/arm64/boot/Image.gz) 字节"
            echo "BUILD_OK=1" > /tmp/build_ok
          else
            echo "✗✗ 无 Image.gz"
            echo "BUILD_OK=0" > /tmp/build_ok
          fi
          # 复制完整编译日志到工作区，供 artifact 上传
          cp /tmp/build_out.txt "$GITHUB_WORKSPACE/build_full.log" 2>/dev/null || true
          # 不掩盖失败：让步骤退出码反映真实结果
          exit $rc

      # ---------- 8. 校验 KSU 是否编进内核 ----------
      - name: Verify KernelSU symbols
        if: always()
        working-directory: kernel
        shell: bash
        run: |
          set +e
          NM="$(cat /tmp/clangdir.txt 2>/dev/null || echo "$GITHUB_WORKSPACE/clang-aosp/clang-r487747c")/bin/llvm-nm"
          if [ ! -f vmlinux ]; then
            echo "✗ vmlinux 不存在 —— 编译未产出，跳过符号校验"
            echo "（详见上一步 Build Image.gz 的完整日志）"
            ls -la arch/arm64/boot/ 2>/dev/null || true
            exit 0
          fi
          echo "=== vmlinux 中的 KSU 符号 ==="
          "$NM" vmlinux 2>/dev/null | grep -i "ksu_" | head -20
          echo "------------------------"
          cnt=$("$NM" vmlinux 2>/dev/null | grep -ci "ksu_")
          echo "KSU 符号数: $cnt"
          if [ "$cnt" -gt 0 ]; then
            echo "✓ KernelSU 已内建"
          else
            echo "✗ 警告：未找到 KSU 符号"
          fi
          echo ""
          echo "=== vermagic（关键：外挂 .ko 需匹配 SMP preempt mod_unload modversions aarch64）==="
          "$NM" vmlinux 2>/dev/null | grep -i "vermagic" || true
          "$(dirname "$NM")/llvm-strings" vmlinux 2>/dev/null \
            | grep -m3 "SMP preempt" || true
          echo ""
          echo "=== ★ 模块子系统自检（v2 新增，决定能否 insmod 外挂 .ko）==="
          echo "--- [1] /proc/modules 注册相关符号 ---"
          "$NM" vmlinux 2>/dev/null | grep -E " (T|t|D|d|R|r|B|b) (__register_chrdev|module_layout|load_module|free_module|do_init_module)$" || echo "  (无)"
          echo "--- [2] 关键模块加载器字符串（必须存在，否则 CONFIG_MODULES=n）---"
          for s in "module_layout" "Unknown symbol" "bad vermagic" \
                   "disagrees about version of symbol" "no symbol version for" \
                   "modules_disabled" "Loading module from fd" \
                   "module is already loaded" "Failed to allocate memory for module"; do
            if "$(dirname "$NM")/llvm-strings" vmlinux 2>/dev/null | grep -qF "$s"; then
              echo "  ✓ $s"
            else
              echo "  ✗ $s   <-- 缺失"
            fi
          done
          echo "--- [3] 导出符号数（CONFIG_MODULES=y 时应有数千个 __ksymtab 条目）---"
          "$NM" vmlinux 2>/dev/null | grep -c "__ksymtab" || echo 0
          echo "--- [4] __this_module 段（模块加载必需）---"
          "$NM" vmlinux 2>/dev/null | grep -i "this_module" || echo "  (无 this_module，正常：那是 .ko 侧节)"
          echo "--- [5] Module.symvers 生成情况（CONFIG_MODULES=y 且非 LTO 时必有）---"
          ls -la Module.symvers 2>/dev/null && wc -l Module.symvers \
            || echo "  ✗✗ Module.symvers 不存在 => CONFIG_MODULES 极可能未生效！"
          echo "=== 产物清单 ==="
          ls -la arch/arm64/boot/ 2>/dev/null || true
          exit 0

      # ---------- 9. 上传 ----------
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raphael-ksu-Image
          if-no-files-found: warn
          path: |
            kernel/arch/arm64/boot/Image.gz
            kernel/arch/arm64/boot/Image
            kernel/vmlinux
            kernel/System.map
            kernel/Module.symvers
            kernel/.config
            kernel/include/config/auto.conf
            build_full.log
          retention-days: 30
